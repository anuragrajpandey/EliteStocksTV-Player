<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EliteStocks TV | CEO Edition</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- HLS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= SPLASH SCREEN ================= -->
<section id="splash-screen" class="screen flex-center">
    <h1 class="static-logo">EliteStocks TV</h1>
    <button onclick="handleLogin()" class="pill-btn-white">Get Started</button>
</section>

<!-- ================= LOADER ================= -->
<section id="loader-screen" class="screen flex-center hidden">
    <div class="loader-wrap">
        <h1 class="rainbow-logo">ESTV</h1>
        <div class="master-bar">
            <div class="bar-fill" id="progress-fill"></div>
        </div>
        <p id="loader-text">ESTABLISHING LUXURY HANDSHAKE...</p>
    </div>
</section>

<!-- ================= MAIN DASHBOARD ================= -->
<section id="main-dashboard" class="screen hidden">

    <!-- HEADER -->
    <header class="netflix-header">
        <div class="header-top-row">
            <div class="header-left">
                <button class="icon-btn" onclick="toggleSearch()">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>

                <nav class="netflix-nav">
                    <button class="nav-link active" onclick="location.reload()">Home</button>
                    <button class="nav-link" onclick="toggleCategoryPopup()">Categories</button>
                </nav>
            </div>

            <div class="header-right">
                <div class="brand-n">ESTV</div>
            </div>
        </div>
        <div class="header-divider"></div>
    </header>

    <!-- ================= SEARCH ================= -->
    <div id="search-bar-wrap" class="search-overlay hidden">
        <div class="search-inner">
            <input
                type="text"
                id="search-input"
                placeholder="Search channels..."
                onkeyup="handleSearch()"
            >
            <button onclick="toggleSearch()" class="close-search-btn">✕</button>
            <div id="search-results" class="search-results-grid"></div>
        </div>
    </div>

    <!-- ================= CONTENT ================= -->
    <main class="netflix-content custom-scrollbar" id="scroll-area">

        <!-- HERO -->
        <section class="hero-card">
            <div class="hero-inner">
                <img id="hero-bg" src="" alt="">
                <div class="hero-vignette"></div>

                <div class="hero-details">
                    <div class="hero-meta">
                        <span class="meta-tag">CEO'S CHOICE</span>
                        <span>LIVE</span>
                        <span>2026</span>
                        <span class="age-tag">ELITE</span>
                    </div>

                    <h1 id="hero-title">EliteStocks TV</h1>
                    <p id="hero-desc">
                        Luxury streaming curated by Anurag Pandey.
                    </p>

                    <button id="hero-play-btn" class="pill-btn-white-hero">
                        <i class="fa-solid fa-play"></i> Watch Now
                    </button>
                </div>
            </div>
        </section>

        <!-- ROWS -->
        <div id="rows-container"></div>

        <!-- INFINITE LOADER -->
        <div id="infinite-loader" class="infinite-status">
            <div class="dot-loader">
                <span></span><span></span><span></span>
            </div>
        </div>
    </main>

    <!-- ================= CATEGORY ================= -->
    <div id="category-popup" class="category-modal hidden" onclick="toggleCategoryPopup()">
        <div class="category-content" onclick="event.stopPropagation()">
            <div class="modal-header">CHANNEL CATEGORIES</div>
            <div id="vertical-category-list" class="vertical-list custom-scrollbar"></div>
        </div>
    </div>

</section>

<!-- ================= PLAYER ================= -->
<div id="player-modal" class="player-overlay hidden">

    <!-- BUFFER / LOADING -->
    <div id="video-buffer-screen" class="buffer-overlay">
        <button onclick="closePlayer()" class="back-pill-btn">
            <i class="fa-solid fa-chevron-left"></i> Cancel
        </button>
        <div class="spinner"></div>
        <p id="funny-load-text">Initializing...</p>
    </div>

    <!-- PLAYER WRAP -->
    <div class="netflix-player-wrap">

        <!-- TOP BAR (YOUTUBE STYLE) -->
        <div class="yt-top-bar">
            <span id="yt-video-title"></span>
            <button class="yt-close-btn" onclick="closePlayer()">✕</button>
        </div>

        <!-- VIDEO -->
        <video id="video" controls autoplay playsinline></video>

        <!-- SUGGESTED CHANNELS -->
        <div id="suggested-channels" class="suggested-row"></div>
    </div>
</div>

<!-- ================= SCRIPT ================= -->
<script src="script.js"></script>

</body>
</html>
